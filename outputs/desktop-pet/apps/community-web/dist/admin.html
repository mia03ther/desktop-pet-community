<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>作品管理 · desktop pet</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <link rel="icon" href="assets/brand-logo.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/#pets"><img src="assets/brand-logo.png" width="36" height="36" alt="desktop pet"><span>desktop pet</span></a><a href="/#pets">返回广场</a><label class="locale-control">语言<select id="site-locale" aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label></header>
  <main id="main" class="admin-main">
    <div class="admin-heading"><div><p class="eyebrow">管理员</p><h1>作品管理</h1></div><button id="admin-logout" type="button" hidden>退出管理</button></div>
    <p id="admin-status" role="status" aria-live="polite">正在连接管理服务…</p>
    <form id="admin-login" hidden><h2>管理员登录</h2><label for="admin-key">管理员密钥</label><input id="admin-key" type="password" autocomplete="off" required maxlength="256"><button type="submit">登录管理</button><p>密钥只用于本站验证，请勿分享。</p></form>
    <section id="admin-workspace" hidden aria-label="作品管理列表">
      <div class="admin-filters"><label>作品类型<select id="admin-kind"><option value="all">全部作品</option><option value="pet">桌宠</option><option value="plugin">插件</option></select></label><label>上架状态<select id="admin-state"><option value="all">全部状态</option><option value="active">已上架</option><option value="hidden">已下架</option></select></label><label>分类<select id="admin-category-filter"><option value="">全部分类</option></select></label><label class="admin-search">搜索<input id="admin-search" type="search" placeholder="搜索作品、作者或编号"></label><button id="admin-refresh" type="button">刷新列表</button></div>
      <p id="admin-count" data-i18n-preserve></p><datalist id="admin-categories"></datalist><div id="admin-list" class="admin-list"></div>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
