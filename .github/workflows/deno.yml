name: desktop pet CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.0.8"
          run_install: false

      - name: 安装桌宠工作区依赖
        working-directory: outputs/desktop-pet
        run: pnpm install --frozen-lockfile

      - name: 先构建完整工作区依赖
        working-directory: outputs/desktop-pet
        run: pnpm build

      - name: 检查桌宠类型、构建、行为与契约
        working-directory: outputs/desktop-pet
        run: pnpm check

      - name: 验证制作、导入和社区交互
        working-directory: outputs/desktop-pet
        run: node --test apps/community-web/tests/*.test.mjs

      - name: 验证公开桌宠与插件包
        working-directory: outputs/desktop-pet
        run: node apps/community-web/test-packages.mjs

      - name: 安装共创服务构建依赖
        run: npm ci --prefix outputs/community-site --ignore-scripts

      - name: 构建独立服务与 Cloudflare 发布包
        run: |
          node outputs/community-host/scripts/build.mjs
          node outputs/community-cloudflare/scripts/build.mjs

      - name: 验证投稿、权限与匿名互动
        run: |
          npm test --prefix outputs/community-site
          npm test --prefix outputs/community-host
          npm test --prefix outputs/community-cloudflare
